name: Android CI & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-architecture-and-privacy:
    name: Verify Zero-Network & Privacy Constraints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Absolute Zero-Internet Permission
        run: |
          echo "Checking for any prohibited android.permission.INTERNET..."
          if grep -rn "android.permission.INTERNET" app/src/ main/ AndroidManifest.xml 2>/dev/null; then
            echo "ERROR: Violation detected! android.permission.INTERNET is strictly forbidden in Quran Alarm."
            exit 1
          else
            echo "PASS: Zero-Internet permission verified. App is 100% Air-Gapped."
          fi

      - name: Verify Absence of Prohibited Dangerous Permissions
        run: |
          echo "Checking for prohibited dangerous permissions (Accessibility & Device Admin)..."
          if grep -rn "BIND_ACCESSIBILITY_SERVICE\|BIND_DEVICE_ADMIN\|SYSTEM_ALERT_WINDOW" app/src/ AndroidManifest.xml 2>/dev/null; then
            echo "ERROR: Prohibited dangerous permission found!"
            exit 1
          else
            echo "PASS: No dangerous or suspicious permissions found."
          fi

      - name: Verify Foundation Docs Integrity
        run: |
          echo "Verifying presence of essential foundation documents..."
          test -f README.md || exit 1
          test -f docs/PRD.md || exit 1
          test -f docs/ARCHITECTURE.md || exit 1
          test -f docs/ROADMAP.md || exit 1
          test -f docs/PARITY.md || exit 1
          test -f AGENTS.md || exit 1
          test -f docs/adr/ADR-001-language-and-ui-framework.md || exit 1
          test -f docs/adr/ADR-002-mushaf-pages-and-coordinate-storage.md || exit 1
          test -f docs/adr/ADR-003-offline-eye-tracking-framework.md || exit 1
          test -f docs/adr/ADR-004-zero-network-and-minimal-permissions.md || exit 1
          test -f docs/adr/ADR-005-alarm-enforcement-and-auto-mute-lifecycle.md || exit 1
          echo "PASS: All foundation documents are intact."

  build-and-test:
    name: Build & Test (Android 8.0 API 26 to Android 15 API 35)
    runs-on: ubuntu-latest
    needs: verify-architecture-and-privacy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests & Lint
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew test --stacktrace
            ./gradlew lint
          else
            echo "Gradle wrapper not yet committed. Passing foundation check."
          fi
