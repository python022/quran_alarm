name: Android CI & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-architecture-and-privacy:
    name: Verify Zero-Network & Privacy Constraints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Absolute Zero-Internet Permission & Zero Network APIs
        run: |
          echo "Checking for any prohibited android.permission.INTERNET..."
          if grep -rn "android.permission.INTERNET" app/src/main/AndroidManifest.xml 2>/dev/null; then
            echo "ERROR: Violation detected! android.permission.INTERNET is strictly forbidden in Quran Alarm."
            exit 1
          fi
          echo "Checking for prohibited network APIs in production source..."
          if grep -rnE "HttpURLConnection|OkHttpClient|Retrofit|java\.net\.Socket|URL\(.*\)\.openStream|openConnection\(" app/src/main/ 2>/dev/null; then
            echo "ERROR: Violation detected! Network APIs are strictly forbidden in Quran Alarm."
            exit 1
          fi
          echo "PASS: Zero-Internet permission and zero network APIs verified. App is 100% Air-Gapped."

      - name: Verify Absence of Prohibited Dangerous Permissions
        run: |
          echo "Checking for prohibited dangerous permissions (Accessibility & Device Admin)..."
          if grep -rn "BIND_ACCESSIBILITY_SERVICE\|BIND_DEVICE_ADMIN" app/src/ AndroidManifest.xml 2>/dev/null; then
            echo "ERROR: Prohibited dangerous permission found!"
            exit 1
          else
            echo "PASS: No dangerous or suspicious permissions found."
          fi

      - name: Verify Essential Repository Files
        run: |
          echo "Verifying presence of essential repository files..."
          test -f README.md || exit 1
          test -f LICENSE || exit 1
          echo "PASS: Essential repository files are intact."

  build-and-test:
    name: Build & Test (Android 8.0 API 26 to Android 15 API 35)
    runs-on: ubuntu-latest
    needs: verify-architecture-and-privacy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests, Lint & Release R8 Build
        run: |
          test -f "./gradlew" || { echo "ERROR: gradlew missing!"; exit 1; }
          ./gradlew testDebugUnitTest lintDebug assembleRelease assembleDebugAndroidTest --stacktrace

      - name: Upload Build APKs
        uses: actions/upload-artifact@v4
        with:
          name: quran-alarm-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

  android-instrumented-test:
    name: Android Emulator Instrumented UI Tests (API 30)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Instrumented UI Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace
